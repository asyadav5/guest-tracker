<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guest Invitation Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #F5F7FC; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1A2E5A 0%, #2C4F9E 100%); padding: 24px 20px 20px; color: #fff; }
  .header-inner { max-width: 700px; margin: 0 auto; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .header-eyebrow { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.55; margin-bottom: 2px; }
  .header h1 { font-size: 22px; font-weight: 800; }
  .btn-settings { background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .stats { display: flex; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-val { font-size: 24px; font-weight: 800; line-height: 1; }
  .stat-lbl { font-size: 10px; opacity: 0.6; margin-top: 1px; }
  .progress-bar-bg { margin-top: 14px; background: rgba(255,255,255,0.15); border-radius: 10px; height: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #7EFFA0; border-radius: 10px; transition: width 0.4s; }
  .progress-pct { font-size: 10px; opacity: 0.5; margin-top: 3px; }
  .main { max-width: 700px; margin: 0 auto; padding: 18px 14px; }
  .search-box { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid #DDE3EE; font-size: 13px; outline: none; font-family: inherit; color: #1A2236; margin-bottom: 12px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .pill { padding: 5px 13px; border-radius: 20px; border: 1.5px solid #DDE3EE; background: #fff; color: #7A8BA6; font-weight: 500; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .pill.active { border-color: #3B6FD4; background: #EBF0FF; color: #2450B0; font-weight: 700; }
  .divider { width: 1px; background: #DDE3EE; margin: 0 2px; }
  .btn-bulk-wa { width: 100%; padding: 10px; border-radius: 10px; border: none; background: #25D366; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
  .btn-add-ghost { width: 100%; padding: 11px; border-radius: 10px; border: 2px dashed #C5CDE0; background: transparent; color: #5A6A8A; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 14px; font-family: inherit; }
  .add-form { background: #fff; border-radius: 12px; padding: 16px; border: 1.5px solid #DDE3EE; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .add-form h3 { font-size: 13px; color: #1A2236; margin-bottom: 10px; }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-input { padding: 9px 12px; border-radius: 8px; border: 1.5px solid #DDE3EE; font-size: 13px; outline: none; width: 100%; font-family: inherit; color: #1A2236; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-primary { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #2C4F9E; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-secondary { padding: 10px 16px; border-radius: 8px; border: 1.5px solid #DDE3EE; background: #fff; color: #7A8BA6; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
  .guest-card { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #E8ECF2; background: #fff; margin-bottom: 8px; }
  .guest-card.invited { background: #F6FFF8; border-color: #A8E6C3; }
  .check-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #BFC8D6; background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; transition: all 0.2s; }
  .check-btn.checked { border-color: #27AE60; background: #27AE60; }
  .guest-info { flex: 1; min-width: 0; }
  .guest-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .guest-name { font-weight: 600; font-size: 14px; color: #1A2236; }
  .badge { border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .badge-mandatory { background: #FFF0F0; color: #C0392B; }
  .badge-mandatory .badge-dot { background: #E74C3C; }
  .badge-optional { background: #F0F4FF; color: #2C5282; }
  .badge-optional .badge-dot { background: #4A90D9; }
  .guest-group { font-size: 11px; color: #7A8BA6; background: #F1F4FA; border-radius: 10px; padding: 1px 8px; }
  .guest-phone { font-size: 11px; color: #7A8BA6; margin-top: 2px; }
  .guest-wa-sent { font-size: 10px; color: #27AE60; margin-top: 1px; }
  .guest-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .btn-wa { background: #25D366; border: none; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 16px; cursor: pointer; line-height: 1; }
  .btn-delete { background: #FFF0F0; border: none; color: #E74C3C; border-radius: 8px; padding: 6px 10px; font-size: 15px; cursor: pointer; line-height: 1; }
  .empty { text-align: center; padding: 48px 24px; color: #A0AABC; font-size: 14px; }
  .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #B0BAD0; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 16px; font-weight: 700; color: #1A2236; margin-bottom: 12px; }
  .modal p { font-size: 14px; color: #5A6A8A; margin-bottom: 16px; }
  .modal label { display: block; font-size: 12px; font-weight: 600; color: #5A6A8A; margin-bottom: 5px; }
  .modal input, .modal select, .modal textarea { padding: 9px 12px; border-radius: 8px; border: 1.5px solid #DDE3EE; font-size: 13px; outline: none; width: 100%; font-family: inherit; color: #1A2236; margin-bottom: 14px; }
  .modal textarea { resize: vertical; }
  .modal-hint { font-size: 11px; color: #A0AABC; margin-top: -10px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-danger { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #E74C3C; color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); color: #fff; padding: 10px 22px; border-radius: 24px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 999; white-space: nowrap; }
  .toast.success { background: #1A2E5A; }
  .toast.error { background: #C0392B; }
  .loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: #7A8BA6; font-size: 14px; }
  code { background: #F1F4FA; padding: 1px 4px; border-radius: 4px; font-size: 11px; }
  @media (max-width: 480px) { .header h1 { font-size: 18px; } .stat-val { font-size: 20px; } }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading guest list…</div></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_W3eMgdsKBWVDO4pRVPVUt_YpF8v1NCTdaNa1AoZrDq0QQbCfMBTLkLN56iJyoDII/exec";
const DEFAULT_MSG = "🎉 You're Invited!\n\nDear {name},\n\nWe joyfully invite you to celebrate with us.\nPlease watch our invitation video:\n{videoLink}\n\nLooking forward to your presence! 🙏";

let guests = [];
let settings = { videoLink: "", message: DEFAULT_MSG, countryCode: "+971" };
let filterStatus = "all", filterPrio = "all", filterGroup = "all", searchQ = "";
let showForm = false, showSettings = false, confirmDeleteId = null, saving = false;

async function loadData() {
  try {
    const res = await fetch(SCRIPT_URL + "?nocache=" + Date.now());
    const rows = await res.json();
    if (!rows || rows.length < 2) { guests = []; return; }
    const dataRows = rows.slice(1);
    if (dataRows.length && dataRows[0][0] === "__SETTINGS__") {
      try { settings = Object.assign({}, settings, JSON.parse(dataRows[0][1])); } catch(_) {}
      guests = dataRows.slice(1).filter(r => r[0]).map(rowToGuest);
    } else {
      guests = dataRows.filter(r => r[0]).map(rowToGuest);
    }
  } catch(e) { showToast("Could not load — check connection", "error"); }
}

function rowToGuest(r) {
  return { id: String(r[0]), name: r[1]||"", priority: r[2]||"Mandatory", group: r[3]||"", phone: r[4]||"", status: r[5]||"pending", waAt: r[6]||"" };
}
function guestToRow(g) { return [g.id, g.name, g.priority, g.group, g.phone, g.status, g.waAt]; }

async function saveData() {
  saving = true; render();
  const headers = ["id","name","priority","group","phone","status","waAt"];
  const settingsRow = ["__SETTINGS__", JSON.stringify(settings),"","","","",""];
  const rows = [headers, settingsRow, ...guests.map(guestToRow)];
  try { await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify(rows) }); }
  catch(e) { showToast("Save failed", "error"); }
  saving = false; render();
}

let toastTimer;
function showToast(msg, type) {
  type = type || "success";
  clearTimeout(toastTimer);
  const old = document.getElementById("toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.id = "toast"; el.className = "toast " + type; el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(function(){ el.remove(); }, 2800);
}

function buildWALink(g) {
  const phone = (settings.countryCode + g.phone).replace(/[^0-9]/g,"");
  const msg = settings.message.replace("{name}", g.name).replace("{videoLink}", settings.videoLink || "[video link]");
  return "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
}

function getFiltered() {
  return guests.filter(function(g) {
    if (filterStatus === "pending" && g.status !== "pending") return false;
    if (filterStatus === "invited" && g.status !== "invited") return false;
    if (filterPrio !== "all" && g.priority !== filterPrio) return false;
    if (filterGroup !== "all" && g.group !== filterGroup) return false;
    if (searchQ && g.name.toLowerCase().indexOf(searchQ.toLowerCase()) === -1) return false;
    return true;
  });
}

function getGroups() {
  return ["all"].concat(Array.from(new Set(guests.map(function(g){ return g.group; }).filter(Boolean))));
}

async function toggleGuest(id) {
  guests = guests.map(function(g){ return g.id !== id ? g : Object.assign({},g,{status: g.status==="invited"?"pending":"invited"}); });
  render(); await saveData();
}

async function sendWA(id) {
  const g = guests.find(function(x){ return x.id===id; });
  if (!g) return;
  guests = guests.map(function(x){ return x.id!==id ? x : Object.assign({},x,{status:"invited",waAt:new Date().toLocaleDateString()}); });
  render();
  window.open(buildWALink(g), "_blank");
  showToast("WhatsApp opened for " + g.name + " ✓");
  await saveData();
}

async function deleteGuest(id) {
  const g = guests.find(function(x){ return x.id===id; });
  guests = guests.filter(function(x){ return x.id!==id; });
  confirmDeleteId = null; render();
  showToast((g ? g.name : "Guest") + " removed");
  await saveData();
}

async function addGuest() {
  const name = document.getElementById("f-name").value.trim();
  if (!name) { showToast("Please enter a name","error"); return; }
  const ng = { id: Date.now().toString(), name: name, priority: document.getElementById("f-priority").value, group: document.getElementById("f-group").value.trim(), phone: document.getElementById("f-phone").value.trim(), status: "pending", waAt: "" };
  guests.push(ng); showForm = false; render();
  showToast(ng.name + " added");
  await saveData();
}

async function bulkWA() {
  const pending = getFiltered().filter(function(g){ return g.status==="pending" && g.phone; });
  if (!pending.length) { showToast("No pending guests with phone numbers","error"); return; }
  const ids = pending.map(function(g){ return g.id; });
  guests = guests.map(function(g){ return ids.indexOf(g.id) >= 0 ? Object.assign({},g,{status:"invited",waAt:new Date().toLocaleDateString()}) : g; });
  render();
  window.open(buildWALink(pending[0]), "_blank");
  showToast("WhatsApp opened for " + pending[0].name + " — " + pending.length + " marked invited");
  await saveData();
}

async function saveSettings() {
  settings.videoLink = document.getElementById("s-video").value.trim();
  settings.message   = document.getElementById("s-msg").value;
  settings.countryCode = document.getElementById("s-cc").value.trim();
  showSettings = false; render();
  showToast("Settings saved ✓");
  await saveData();
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  const filtered = getFiltered();
  const total = guests.length;
  const invitedCount = guests.filter(function(g){ return g.status==="invited"; }).length;
  const mandatoryLeft = guests.filter(function(g){ return g.priority==="Mandatory" && g.status==="pending"; }).length;
  const withPhone = guests.filter(function(g){ return g.phone; }).length;
  const pct = total ? Math.round((invitedCount/total)*100) : 0;
  const groups = getGroups();
  const pendingWithPhone = filtered.filter(function(g){ return g.status==="pending" && g.phone; }).length;

  let html = "";

  // HEADER
  html += '<div class="header"><div class="header-inner">';
  html += '<div class="header-top"><div><div class="header-eyebrow">Family Event</div><h1>Guest Invitation Tracker</h1></div>';
  html += '<button class="btn-settings" onclick="showSettings=true;render()">⚙️ Settings</button></div>';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-val">'+total+'</div><div class="stat-lbl">Total</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#7EFFA0">'+invitedCount+'</div><div class="stat-lbl">Invited</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#FFD580">'+(total-invitedCount)+'</div><div class="stat-lbl">Pending</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#FF9898">'+mandatoryLeft+'</div><div class="stat-lbl">Mandatory Left</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#A0C4FF">'+withPhone+'</div><div class="stat-lbl">With Phone</div></div>';
  html += '</div>';
  html += '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="progress-pct">'+pct+'% invited</div>';
  html += '</div></div>';

  // MAIN
  html += '<div class="main">';
  html += '<input class="search-box" placeholder="🔍  Search guest by name…" value="'+escHtml(searchQ)+'" oninput="searchQ=this.value;render()" />';

  // FILTERS
  html += '<div class="filters">';
  ["all","pending","invited"].forEach(function(f){
    const lbl = f==="all"?"All":f==="pending"?"⏳ Pending":"✅ Invited";
    html += '<button class="pill'+(filterStatus===f?' active':'')+'" onclick="filterStatus=\''+f+'\';render()">'+lbl+'</button>';
  });
  html += '<div class="divider"></div>';
  ["all","Mandatory","Optional"].forEach(function(f){
    const lbl = f==="all"?"All Types":f;
    html += '<button class="pill'+(filterPrio===f?' active':'')+'" onclick="filterPrio=\''+f+'\';render()">'+lbl+'</button>';
  });
  if (groups.length > 1) {
    html += '<div class="divider"></div>';
    groups.forEach(function(g){
      html += '<button class="pill'+(filterGroup===g?' active':'')+'" onclick="filterGroup=\''+escHtml(g)+'\';render()">'+(g==="all"?"All Groups":escHtml(g))+'</button>';
    });
  }
  html += '</div>';

  // BULK WA
  if (pendingWithPhone > 0) {
    html += '<button class="btn-bulk-wa" onclick="bulkWA()">📤 Send WhatsApp to All Pending ('+pendingWithPhone+')</button>';
  }

  // ADD FORM
  if (showForm) {
    html += '<div class="add-form"><h3>New Guest</h3>';
    html += '<div class="form-row"><input id="f-name" class="form-input" placeholder="Full Name *" /></div>';
    html += '<div class="form-row"><select id="f-priority" class="form-input" style="flex:1"><option>Mandatory</option><option>Optional</option></select>';
    html += '<input id="f-group" class="form-input" placeholder="Group / Family" style="flex:2" /></div>';
    html += '<div class="form-row"><input class="form-input" style="width:72px;flex-shrink:0" value="'+escHtml(settings.countryCode)+'" oninput="settings.countryCode=this.value" />';
    html += '<input id="f-phone" class="form-input" placeholder="Phone (for WhatsApp)" style="flex:1" /></div>';
    html += '<div class="form-actions"><button class="btn-primary" onclick="addGuest()">Add Guest</button>';
    html += '<button class="btn-secondary" onclick="showForm=false;render()">Cancel</button></div></div>';
  } else {
    html += '<button class="btn-add-ghost" onclick="showForm=true;render()">+ Add Guest</button>';
  }

  // GUEST LIST
  if (filtered.length === 0) {
    html += '<div class="empty">'+(guests.length===0?"No guests yet — add your first guest above.":"No guests match your filters.")+'</div>';
  } else {
    filtered.forEach(function(g) {
      const inv = g.status === "invited";
      html += '<div class="guest-card'+(inv?' invited':'')+'">';
      html += '<button class="check-btn'+(inv?' checked':'')+'" onclick="toggleGuest(\''+g.id+'\')">'+(inv?'✓':'')+'</button>';
      html += '<div class="guest-info"><div class="guest-name-row">';
      html += '<span class="guest-name">'+escHtml(g.name)+'</span>';
      html += '<span class="badge badge-'+g.priority.toLowerCase()+'"><span class="badge-dot"></span>'+escHtml(g.priority)+'</span>';
      if (g.group) html += '<span class="guest-group">'+escHtml(g.group)+'</span>';
      html += '</div>';
      if (g.phone) html += '<div class="guest-phone">📱 '+escHtml(g.phone)+'</div>';
      if (g.waAt) html += '<div class="guest-wa-sent">WhatsApp sent · '+escHtml(g.waAt)+'</div>';
      html += '</div>';
      html += '<div class="guest-actions">';
      if (g.phone) html += '<button class="btn-wa" onclick="sendWA(\''+g.id+'\')" title="Send WhatsApp">💬</button>';
      html += '<button class="btn-delete" onclick="confirmDeleteId=\''+g.id+'\';render()" title="Remove">🗑️</button>';
      html += '</div></div>';
    });
  }

  html += '<div class="footer">'+(saving?"Saving…":"Showing "+filtered.length+" of "+total+" guests")+'</div>';
  html += '</div>';

  // DELETE MODAL
  if (confirmDeleteId) {
    const g = guests.find(function(x){ return x.id===confirmDeleteId; });
    html += '<div class="modal-overlay"><div class="modal">';
    html += '<h2>Remove Guest?</h2>';
    html += '<p>Are you sure you want to remove <strong>'+escHtml(g?g.name:"this guest")+'</strong> from the list?</p>';
    html += '<div class="modal-actions">';
    html += '<button class="btn-danger" onclick="deleteGuest(\''+confirmDeleteId+'\')">Yes, Remove</button>';
    html += '<button class="btn-secondary" onclick="confirmDeleteId=null;render()">Cancel</button>';
    html += '</div></div></div>';
  }

  // SETTINGS MODAL
  if (showSettings) {
    html += '<div class="modal-overlay"><div class="modal">';
    html += '<h2>⚙️ Settings</h2>';
    html += '<label>Default Country Code</label>';
    html += '<input id="s-cc" value="'+escHtml(settings.countryCode)+'" placeholder="+971" />';
    html += '<label>🎬 Invitation Video Link</label>';
    html += '<input id="s-video" value="'+escHtml(settings.videoLink)+'" placeholder="https://youtube.com/... or Drive link" />';
    html += '<p class="modal-hint">This link goes into every WhatsApp message automatically</p>';
    html += '<label>💬 WhatsApp Message Template</label>';
    html += '<p class="modal-hint">Use <code>{name}</code> for guest name and <code>{videoLink}</code> for the video link</p>';
    html += '<textarea id="s-msg" rows="7">'+escHtml(settings.message)+'</textarea>';
    html += '<div class="modal-actions">';
    html += '<button class="btn-primary" onclick="saveSettings()">Save Settings</button>';
    html += '<button class="btn-secondary" onclick="showSettings=false;render()">Close</button>';
    html += '</div></div></div>';
  }

  document.getElementById("app").innerHTML = html;
}

(async function(){
  await loadData();
  render();
})();
</script>
</body>
</html>
